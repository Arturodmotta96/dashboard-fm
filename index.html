<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FM × Rey · Dashboard comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script data-goatcounter="https://fmrey.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="https://gc.zgo.at/count.js"></script>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:#e5e9f0;
  --navy:#0b1730;--navy2:#13244a;--blue:#2563eb;--blue2:#dbeafe;--red:#dc2626;--red2:#fee2e2;
  --green:#059669;--green2:#d1fae5;--amber:#d97706;--amber2:#fef3c7;--gray2:#f1f5f9;
  --r:12px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* Gate */
#gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% 0%,#1d3a7a 0%,var(--navy) 60%);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.gbox{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gbox .logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.gbox .logo span{color:var(--blue)}
.gbox p{color:var(--ink2);margin:6px 0 22px;font-size:13px}
.gbox input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none}
.gbox input:focus{border-color:var(--blue)}
.gbox button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;font-size:15px}
.gbox button:disabled{opacity:.6;cursor:wait}
#gerr{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:232px;background:var(--navy);color:#cbd5e1;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand small{color:#7f8db0;font-size:11.5px}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:#b6c2dc;font-weight:500;margin-bottom:2px;user-select:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--blue);color:#fff}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav a .ct{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px}
.sidefoot{padding:14px 20px;font-size:11px;color:#6b7aa0;border-top:1px solid rgba(255,255,255,.07)}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.top select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:220px;cursor:pointer}
.upd{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:20px;white-space:nowrap}
.warn{background:var(--amber2);color:#92400e;border:1px solid #fcd34d;font-size:12.5px;padding:8px 28px}
.content{padding:24px 28px 60px;max-width:1500px}

/* Hero & cards */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--ink2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-top:3px solid var(--blue)}
.kpi.red{border-top-color:var(--red)}.kpi.green{border-top-color:var(--green)}.kpi.amber{border-top-color:var(--amber)}
.kpi .kl{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
.kpi .kv small{font-size:14px;color:var(--ink3);font-weight:600}
.kpi .ks{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:18px;min-width:0}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g2>.card{margin-bottom:0}.g2{margin-bottom:18px}
.g32{display:grid;grid-template-columns:3fr 2fr;gap:18px;margin-bottom:18px}.g32>.card{margin-bottom:0}
.ch{position:relative;height:280px}
.ch.tall{height:360px}
.note{font-size:12px;color:var(--ink2);background:var(--gray2);border-radius:10px;padding:12px 14px;line-height:1.6}

/* Tables */
.tw{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#f8fafc;text-align:left;font-weight:600;color:var(--ink2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th.srt{cursor:pointer}th.srt:hover{color:var(--ink)}
th.asc:after{content:" ▲";font-size:9px}th.desc:after{content:" ▼";font-size:9px}
td{padding:8px 10px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f8faff}
.r{text-align:right;white-space:nowrap}
.tfoot{display:flex;align-items:center;gap:10px;padding:10px 2px 0;font-size:12px;color:var(--ink2)}
.tfoot span{margin-right:auto}
.pn{font-weight:600;min-width:210px;max-width:340px}
td>b:first-child{white-space:nowrap}
.sub{color:var(--ink3);font-size:11.5px}
.chip{display:inline-block;background:var(--gray2);border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tag{display:inline-block;border-radius:20px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.red{background:var(--red2);color:var(--red)}.tag.green{background:var(--green2);color:var(--green)}
.tag.amber{background:var(--amber2);color:var(--amber)}.tag.gray{background:var(--gray2);color:var(--ink2)}.tag.blue{background:var(--blue2);color:var(--blue)}
.up{color:var(--green);font-weight:700;white-space:nowrap}.dn{color:var(--red);font-weight:700;white-space:nowrap}.na{color:var(--ink3)}
.spk{display:inline-flex;align-items:flex-end;gap:2px;height:22px;vertical-align:middle}
.spk i{display:block;width:6px;background:#93b4f5;border-radius:2px 2px 0 0;min-height:1px}
.spk i:last-child{background:var(--blue)}
.bar{height:6px;background:var(--gray2);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px}

/* Controls */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.filters input{min-width:240px;flex:1;max-width:380px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;user-select:none}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{padding:8px 14px;border-radius:9px;border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn.sm{padding:5px 11px;font-size:12px}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}

/* Gerente cards */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.gc:hover{border-color:var(--blue);transform:translateY(-1px)}
.gc .gn{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gc .gs{color:var(--ink2);font-size:12px;margin:2px 0 12px}
.gc .gm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gc .gm div{background:#f8fafc;border-radius:8px;padding:7px 9px}
.gc .gm b{display:block;font-size:15px}
.gc .gm span{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.gc .gb{display:flex;flex-wrap:wrap;gap:4px;max-height:48px;overflow:hidden}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:1100px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.mhd{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mhd h3{font-size:17px;flex:1}
.mhd .sub{display:block;margin-top:2px;font-weight:400}
.mhd button{border:0;background:var(--gray2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}
.mbd{padding:18px 22px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.info div{background:#f8fafc;border-radius:9px;padding:9px 11px}
.info span{display:block;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.info b{font-size:14px}

@media (max-width:1100px){.g2,.g32{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:relative}
  .brand{padding:14px 16px}.sidefoot{display:none}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav a{white-space:nowrap;margin:0;padding:8px 10px}
  .nav a .ct{display:none}
  .top{padding:10px 16px}.top h1{flex:1;font-size:17px}.top select{order:3;flex-basis:100%;min-width:0}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 13px}.kpi .ks{font-size:11.5px}
  .content{padding:16px 16px 50px}.warn{padding:8px 16px}
  .kpi .kv{font-size:19px}
  .filters input{min-width:0;max-width:none}
}
</style>
</head>
<body>

<div id="gate">
  <form class="gbox" onsubmit="event.preventDefault();login()">
    <div class="logo">FM <span>×</span> Rey</div>
    <p>Dashboard comercial Felipe Motta S.A. · Acceso restringido</p>
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
    <button id="pwb" type="submit">Entrar</button>
    <div id="gerr"></div>
  </form>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><b>FM × Rey</b><small>Dashboard comercial</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">Reycom + smrey.com<br>Datos: 28/10/2026</div>
  </aside>
  <div class="main">
    <div class="top">
      <h1 id="ttl">Negocio FM</h1>
      <select id="usel" onchange="setUni(this.value)"></select>
      <select id="gsel" onchange="setGer(this.value)"></select>
      <span class="upd" id="upd"></span>
    </div>
    <div class="warn hidden" id="warn"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal hidden" id="modal" onclick="if(event.target===this)closeM()">
  <div class="mbox"><div class="mhd"><h3 id="mt"></h3><button onclick="closeM()" aria-label="Cerrar">×</button></div><div class="mbd" id="mb"></div></div>
</div>

/* ───────── Acceso: los datos vienen cifrados (AES-256-CBC + HMAC-SHA256) y solo se abren con la contraseña ───────── */
async function decrypt(pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,512));
  const iv=b(ENC.i),ct=b(ENC.d),msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
  const mk=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await crypto.subtle.verify('HMAC',mk,b(ENC.m),msg))throw new Error('pw');
  const ek=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct);
  const txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
/* Visitas (GoatCounter): solo después de la contraseña. No guarda datos personales. */
function gc(path,title,n){
  n=n||0;
  try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:path,title:title,event:true}); return } }catch(e){ return }
  if(n<20)setTimeout(()=>gc(path,title,n+1),500);
}
async function login(saved){
  const pw=saved||document.getElementById('pw').value, btn=document.getElementById('pwb'), err=document.getElementById('gerr');
  if(!pw)return;
  btn.disabled=true;btn.textContent='Abriendo…';err.textContent='';
  try{
    D=await decrypt(pw);
    try{sessionStorage.setItem('fmpw',pw)}catch(e){}
    if(!saved)gc('ingreso','Ingreso con contraseña');
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    init();
  }catch(e){
    try{sessionStorage.removeItem('fmpw')}catch(_){}
    if(!saved)err.textContent='Contraseña incorrecta.';
    btn.disabled=false;btn.textContent='Entrar';
  }
}
(function(){let s=null;try{s=sessionStorage.getItem('fmpw')}catch(e){} if(s)login(s);})();

const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const fN=n=>n==null||isNaN(n)?'—':nf0.format(Math.round(n));
const fD=n=>n==null||isNaN(n)?'—':(n<0?'-$':'$')+nf0.format(Math.abs(Math.round(n)));
const fM=n=>n==null?'—':'$'+Number(n).toFixed(2);
const fK=n=>Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?'$'+(n/1e3).toFixed(1)+'K':fD(n);
const fPct=x=>x==null||!isFinite(x)?'—':Math.round(x*100)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tb(x){
  if(x===Infinity)return'<span class="tag blue">Nuevo</span>';
  if(x==null||isNaN(x))return'<span class="na">—</span>';
  const p=Math.round(x*100);
  return p>=0?'<span class="up">▲ '+p+'%</span>':'<span class="dn">▼ '+Math.abs(p)+'%</span>';
}
function dlt(x,txt){return tb(x)+' <span class="sub">'+txt+'</span>'}
function fDias(d){if(d==null)return'<span class="na">—</span>';const v=Math.round(d);const c=v<7?'dn':v>90?'na':'';return'<span class="'+c+'">'+(v>365?'>365':v)+' d</span>'}
function spark(a){const mx=Math.max(...a,1);return'<span class="spk">'+a.map(v=>'<i style="height:'+Math.max(4,Math.round(v/mx*100))+'%"></i>').join('')+'</span>'}
const sum=(L,f)=>L.reduce((a,x)=>a+(f(x)||0),0);
const uniq=a=>[...new Set(a)];
const el=id=>document.getElementById(id);
function groupBy(L,f){const m=new Map();for(const x of L){const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}return m}

function init(){
  M=D.meta;
  const f=M.en_curso&&M.dia>0?M.dias_mes/M.dia:1;
  P=D.P.map((r,i)=>{
    const so=r[8],c=r[6],w=r[15];
    const proj=Math.round(so[4]*f),b3=(so[1]+so[2]+so[3])/3;
    const net=w?w[0]/(1+(r[7]||0)/100):null, netOf=w&&w[1]?w[1]/(1+(r[7]||0)/100):null;
    return{i,upc:r[0],d:r[1],m:r[2],dep:r[3],cat:r[4],act:r[5],c,itbm:r[7],so,inv:r[9],tr:r[10],tf:r[11],falt:r[12],ries:r[13],vp:r[14],
      g:r[16]||D.G[r[2]]||'Sin asignar',uni:r[17]||'Sin unidad',proj,projV:proj*c,b3,b3V:b3*c,venta5:so.reduce((a,v)=>a+v,0),
      tend:b3>0?(proj-b3)/b3:(proj>0?Infinity:null),dInv:proj>0?r[9]/(proj/M.dias_mes):null,
      web:!!w,webNom:w?w[5]||null:null,precio:w?w[0]:null,pof:w?w[1]:null,dto:w?w[2]:null,tipo:w?w[3]:null,fin:w?w[4]:null,
      margen:net>0?(net-c)/net:null,margenOf:netOf>0?(netOf-c)/netOf:null};
  });
  T=D.T.map((r,i)=>({i,t:r[0],so:r[1],v:r[2],filas:r[3],falt:r[4],ries:r[5],vp:r[6],projV:r[2][4]*f,b3V:(r[2][1]+r[2][2]+r[2][3])/3}));
  F=D.F.map(r=>({p:P[r[0]],ti:r[1],t:D.T[r[1]][0],vp:r[2]}));
  GL=uniq(P.map(p=>p.g)).sort((a,b)=>(a==='Sin asignar')-(b==='Sin asignar')||a.localeCompare(b));
  UL=(D.U||[]).filter(u=>P.some(p=>p.uni===u.n)).sort((x,y)=>sum(P.filter(p=>p.uni===y.n),p=>p.projV)-sum(P.filter(p=>p.uni===x.n),p=>p.projV));
  el('usel').innerHTML='<option value="">Todas las unidades</option>'+UL.map(u=>'<option>'+esc(u.n)+'</option>').join('');
  if(!UL.length)el('usel').classList.add('hidden');
  fillGer();
  el('upd').textContent='Reycom · '+M.semana;
  const w=[];
  if(M.truncado)w.push('<b>Datos incompletos:</b> la descarga de Reycom llegó al límite de '+fN(M.filas)+' filas, así que faltan tiendas o productos. Descargar el reporte en partes (por ejemplo por división) para tener el 100%.');
  if(!M.web_ok)w.push('No se pudo consultar smrey.com en esta actualización: precios y ofertas no disponibles.');
  if(w.length){el('warn').innerHTML=w.join('<br>');el('warn').classList.remove('hidden')}
  let h='';try{h=location.hash.slice(1)}catch(e){}
  go(PAGES.some(p=>p[0]===h)?h:'resumen');
}

function fillGer(){
  const gs=UNI?GL.filter(g=>P.some(p=>p.g===g&&p.uni===UNI)):GL;
  if(GER&&!gs.includes(GER))GER='';
  el('gsel').innerHTML='<option value="">'+(UNI?'Todos los gerentes de la unidad':'Todos los gerentes')+'</option>'+gs.map(g=>'<option>'+esc(g)+'</option>').join('');
  el('gsel').value=GER;
}
function agg(L){
  const a={n:L.length,act:0,so:[0,0,0,0,0],v:[0,0,0,0,0],proj:0,projV:0,b3V:0,inv:0,falt:0,ries:0,tf:0,vp:0,of:0,ofFalt:0,conVenta:0,web:0,marcas:new Set()};
  for(const p of L){
    if(p.act)a.act++;
    for(let k=0;k<5;k++){a.so[k]+=p.so[k];a.v[k]+=p.so[k]*p.c}
    a.proj+=p.proj;a.projV+=p.projV;a.b3V+=p.b3V;a.inv+=p.inv;a.falt+=p.falt;a.ries+=p.ries;a.tf+=p.tf;a.vp+=p.vp;
    if(p.pof){a.of++;if(p.falt)a.ofFalt++}
    if(p.venta5>0)a.conVenta++;
    if(p.web)a.web++;
    a.marcas.add(p.m);
  }
  a.tend=a.b3V>0?(a.projV-a.b3V)/a.b3V:null;
  a.tendPrev=a.v[3]>0?(a.projV-a.v[3])/a.v[3]:null;
  a.quiebre=a.tf>0?a.falt/a.tf:0;
  a.dInv=a.proj>0?a.inv/(a.proj/M.dias_mes):null;
  return a;
}

/* ───────── Componentes ───────── */
function kpi(l,v,subs,cls){return'<div class="kpi '+(cls||'')+'"><div class="kl">'+l+'</div><div class="kv">'+v+'</div><div class="ks">'+(subs||[]).map(s=>'<span>'+s+'</span>').join('')+'</div></div>'}
function hero(t,s,extra){return'<div class="hero"><div><h2>'+esc(t)+'</h2><p>'+s+'</p></div>'+(extra||'')+'</div>'}
function chart(id,cfg){if(CH[id])CH[id].destroy();const c=el(id);if(!c)return;CH[id]=new Chart(c,cfg)}
Chart.defaults.font.family='Inter,-apple-system,sans-serif';Chart.defaults.font.size=11.5;Chart.defaults.color='#64748b';
const PAL=['#2563eb','#0891b2','#7c3aed','#db2777','#ea580c','#059669','#ca8a04','#4f46e5','#0d9488','#be123c','#65a30d','#9333ea','#0284c7','#c2410c','#15803d','#a21caf','#334155','#b45309'];
const grid={color:'#eef2f7'};

const TB={};
function table(id,cols,rows,opt){
  opt=opt||{};
  if(typeof opt.sort==='string'){const s=opt.sort;opt.sort=cols.findIndex(c=>c.h.startsWith(s));if(opt.sort<0)opt.sort=null}
  const old=TB[id];
  TB[id]={cols,rows,opt,k:old&&old.cols.length===cols.length?old.k:(opt.sort??null),dir:old&&old.cols.length===cols.length?old.dir:(opt.dir??-1),lim:opt.lim||60};
  drawT(id);
}
function sval(c,r){const v=(c.s||c.v)(r);return v==null||(typeof v==='number'&&isNaN(v))?null:v}
function drawT(id){
  const st=TB[id],box=el(id);if(!box)return;
  let rows=st.rows.slice();
  if(st.k!=null){const c=st.cols[st.k];rows.sort((a,b)=>{const x=sval(c,a),y=sval(c,b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(typeof x==='string'?x.localeCompare(y):(x-y))*st.dir})}
  const shown=rows.slice(0,st.lim);
  let h='<div class="tw"><table><thead><tr>'+st.cols.map((c,i)=>'<th class="'+(c.cls||'')+(c.nos?'':' srt')+(st.k===i?(st.dir>0?' asc':' desc'):'')+'"'+(c.nos?'':' onclick="sortT(\''+id+'\','+i+')"')+'>'+c.h+'</th>').join('')+'</tr></thead><tbody>';
  h+=shown.length?shown.map((r,ri)=>'<tr'+(st.opt.click?' class="clk" onclick="rowT(\''+id+'\','+ri+')"':'')+'>'+st.cols.map(c=>'<td class="'+(c.cls||'')+'">'+(c.f?c.f(r):esc(c.v(r)))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+st.cols.length+'" class="sub" style="text-align:center;padding:24px">Sin resultados</td></tr>';
  h+='</tbody></table></div><div class="tfoot"><span>'+fN(shown.length)+' de '+fN(rows.length)+'</span>'+(rows.length>st.lim?'<button class="btn sm ghost" onclick="moreT(\''+id+'\')">Mostrar más</button>':'')+(st.opt.csv?'<button class="btn sm ghost" onclick="csvT(\''+id+'\')">⬇ CSV</button>':'')+'</div>';
  st.shown=shown;st.sorted=rows;box.innerHTML=h;
}
function sortT(id,i){const st=TB[id];if(st.k===i)st.dir*=-1;else{st.k=i;const v=st.rows.length?sval(st.cols[i],st.rows[0]):0;st.dir=typeof v==='string'?1:-1}drawT(id)}
function moreT(id){TB[id].lim+=200;drawT(id)}
function rowT(id,ri){TB[id].opt.click(TB[id].shown[ri])}
function csvT(id){
  const st=TB[id],cols=st.cols.filter(c=>!c.nocsv);
  const cell=x=>{if(x==null||(typeof x==='number'&&!isFinite(x)))return'';if(typeof x==='number')x=Math.round(x*100)/100;x=String(x);return/[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const lines=[cols.map(c=>cell(c.ch||c.h.replace(/<[^>]+>/g,''))).join(',')].concat(st.sorted.map(r=>cols.map(c=>cell((c.x||c.s||c.v)(r))).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='FM_Rey_'+id+'_'+M.fecha_csv+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* Columnas reutilizables */
function cProd(){return{h:'Producto',v:p=>p.d,f:p=>'<div class="pn">'+esc(p.d)+'</div><div class="sub">'+p.upc+(p.act?'':' · <span class="tag gray">Inactivo</span>')+'</div>',x:p=>p.d}}
const cUPC={h:'UPC',v:p=>p.upc,nos:0,f:p=>'',cls:'hidden',ch:'UPC'};
function prodCols(o){
  o=o||{};const m=M.meses;
  return[cProd(),cUPC,
    {h:'Marca',v:p=>p.m,f:p=>'<span class="chip">'+esc(p.m)+'</span>'},
    GER&&!o.g?null:{h:'Gerente',v:p=>p.g,f:p=>'<span class="sub">'+esc(p.g)+'</span>'},
    {h:m[2],v:p=>p.so[2],f:p=>fN(p.so[2]),cls:'r'},
    {h:m[3],v:p=>p.so[3],f:p=>fN(p.so[3]),cls:'r'},
    {h:mesLbl(),v:p=>p.proj,f:p=>'<b>'+fN(p.proj)+'</b>',cls:'r'},
    {h:'Δ vs 3M',v:p=>p.tend===Infinity?9e9:p.tend,f:p=>tb(p.tend),x:p=>p.tend===Infinity?'nuevo':p.tend,cls:'r'},
    {h:'5 meses',v:p=>p.venta5,f:p=>spark(p.so),nos:1,nocsv:1},
    {h:'Venta $',v:p=>p.projV,f:p=>fD(p.projV),cls:'r',ch:'Venta $ '+mesLbl()},
    {h:'Inv.',v:p=>p.inv,f:p=>fN(p.inv),cls:'r'},
    {h:'Días inv.',v:p=>p.dInv,f:p=>fDias(p.dInv),cls:'r'},
    {h:'Faltante',v:p=>p.falt*1000+p.ries,f:p=>p.falt?'<span class="tag red">'+p.falt+' tiendas</span>'+(p.ries?' <span class="tag amber">+'+p.ries+'</span>':''):(p.ries?'<span class="tag amber">'+p.ries+' en riesgo</span>':'<span class="na">—</span>'),x:p=>p.falt,cls:'r'},
    {h:'VP/mes',v:p=>p.vp,f:p=>p.vp?fD(p.vp):'<span class="na">—</span>',cls:'r'},
    {h:'Precio Rey',v:p=>p.precio,f:p=>p.precio?fM(p.precio):'<span class="na">no encontrado</span>',cls:'r'},
    {h:'Oferta',v:p=>p.dto,f:p=>p.pof?'<span class="tag green">'+esc(p.tipo)+'</span>':'',x:p=>p.tipo,cls:'r'},
  ].filter(Boolean);
}
function grpRows(L,key){return[...groupBy(L,key)].map(([k,ps])=>({k,ps,a:agg(ps)}))}
function grpCols(label,o){
  o=o||{};
  return[{h:label,v:r=>r.k,f:r=>'<b>'+esc(r.k)+'</b>'+(o.sub?'<div class="sub">'+o.sub(r)+'</div>':'')},
    o.marcas?{h:'Marcas',v:r=>r.a.marcas.size,cls:'r'}:null,
    {h:'Productos',v:r=>r.a.n,f:r=>fN(r.a.n),cls:'r'},
    {h:'Venta '+mesLbl(),v:r=>r.a.projV,f:r=>'<b>'+fD(r.a.projV)+'</b>',cls:'r'},
    {h:'Δ vs '+M.meses[3],v:r=>r.a.tendPrev,f:r=>tb(r.a.tendPrev),cls:'r'},
    {h:'Δ vs 3M',v:r=>r.a.tend,f:r=>tb(r.a.tend),cls:'r'},
    {h:'5 meses',v:r=>r.a.v[4],f:r=>spark(r.a.v),nos:1,nocsv:1},
    {h:'Días inv.',v:r=>r.a.dInv,f:r=>fDias(r.a.dInv),cls:'r'},
    {h:'Faltantes',v:r=>r.a.falt,f:r=>r.a.falt?'<span class="tag red">'+fN(r.a.falt)+'</span>':'<span class="na">0</span>',cls:'r'},
    {h:'% quiebre',v:r=>r.a.quiebre,f:r=>fPct(r.a.quiebre),cls:'r'},
    {h:'VP/mes',v:r=>r.a.vp,f:r=>r.a.vp?fD(r.a.vp):'<span class="na">—</span>',cls:'r'},
    {h:'En oferta',v:r=>r.a.of,f:r=>r.a.of?'<span class="tag green">'+r.a.of+'</span>':'<span class="na">—</span>',cls:'r'},
  ].filter(Boolean);
}
function kpiRow(a,L){
  const m=M.meses;
  return'<div class="kpis">'
   +kpi('Venta '+m[4]+(M.en_curso?' (proyectada)':''),fD(a.projV),[dlt(a.tendPrev,'vs '+m[3]),dlt(a.tend,'vs prom. 3 meses')])
   +kpi('Unidades '+m[4]+(M.en_curso?' (proy.)':''),fN(a.proj),[M.en_curso?'Real al día '+M.dia+': '+fN(a.so[4]):'Mes completo','Inventario: '+fN(a.inv)+' und · '+(a.dInv?Math.round(a.dInv)+' días':'—')])
   +kpi('Productos con venta',fN(a.conVenta)+' <small>/ '+fN(a.n)+'</small>',[fN(a.marcas.size)+' marcas · '+fN(a.act)+' activos Z1',fN(a.web)+' visibles en smrey.com'])
   +kpi('Faltantes (tienda × SKU)',fN(a.falt),[fPct(a.quiebre)+' de quiebre',fN(a.ries)+' más en riesgo (< 1 semana)'],'red')
   +kpi('Venta perdida / mes',fD(a.vp),['por faltantes, a costo','= '+fPct(a.b3V>0?a.vp/a.b3V:0)+' de la venta'],'red')
   +kpi('En oferta en Rey',fN(a.of),[a.ofFalt?'<span class="dn">'+a.ofFalt+' en oferta con faltante</span>':'Sin ofertas en faltante','smrey.com · '+esc(M.tienda_web)],'green')
   +'</div>';
}
function trendChart(id,a){
  const m=M.meses.map((x,i)=>i===4&&M.en_curso?x+' (proy.)':x);
  const real=a.v.slice(),rest=[0,0,0,0,Math.max(0,a.projV-a.v[4])];
  chart(id,{type:'bar',data:{labels:m,datasets:[
    {label:'Venta real',data:real,backgroundColor:'#2563eb',borderRadius:6,stack:'s'},
    {label:'Proyección resto del mes',data:rest,backgroundColor:'rgba(37,99,235,.25)',borderRadius:6,stack:'s'}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fD(c.raw)}}},
      scales:{x:{grid:{display:false},stacked:true},y:{stacked:true,grid,ticks:{callback:v=>fK(v)}}}}});
}
function hbar(id,rows,valF,lblF,color){
  chart(id,{type:'bar',data:{labels:rows.map(lblF),datasets:[{data:rows.map(valF),backgroundColor:color||rows.map((_,i)=>PAL[i%PAL.length]),borderRadius:5}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fD(c.raw)}}},scales:{x:{grid,ticks:{callback:v=>fK(v)}},y:{grid:{display:false},ticks:{autoSkip:false}}}}});
}

/* ───────── Negocio FM ───────── */
function rResumen(){
  const L=FP(),a=agg(L),byG=!GER;
  const gr=grpRows(L,byG?p=>p.g:p=>p.m).sort((x,y)=>y.a.projV-x.a.projV);
  const mov=L.filter(p=>p.b3>=10&&p.act);
  el('content').innerHTML=hero(GER||(UNI?UNI+(jefe(UNI)?' · '+jefe(UNI):''):'Negocio total FM en Rey'),'Reycom '+esc(M.semana)+' · '+fN(a.n)+' productos · '+fN(a.marcas.size)+' marcas · venta a costo de compra Rey')
   +kpiRow(a,L)
   +'<div class="g32"><div class="card"><h3>Sell-out mensual <span class="sub">$ a costo Rey</span></h3><div class="ch"><canvas id="c1"></canvas></div></div>'
   +'<div class="card"><h3>Venta '+mesLbl()+' por '+(byG?'gerente':'marca')+'</h3><div class="ch"><canvas id="c2"></canvas></div></div></div>'
   +'<div class="card"><h3>'+(byG?'Gerentes de marca':'Marcas de '+esc(GER))+' <span class="sub">· clic para ver el detalle</span></h3><div id="t1"></div></div>'
   +'<div class="g2"><div class="card"><h3>▲ Productos que más crecen <span class="sub">'+mesLbl()+' vs prom. 3 meses, en $</span></h3><div id="t2"></div></div>'
   +'<div class="card"><h3>▼ Productos que más caen</h3><div id="t3"></div></div></div>'
   +'<div class="note"><b>Cómo leer este dashboard.</b> Fuente: reporte Reycom descargado el '+esc(M.semana)+' ('+fN(M.filas)+' filas producto × tienda). '
   +'Venta $ = unidades vendidas × costo de compra Rey. '+(M.en_curso?'Proyección de '+M.meses[4]+' = venta al día '+M.dia+' × '+M.dias_mes+' / '+M.dia+'. ':'')
   +'Δ vs 3M compara contra el promedio de '+M.meses.slice(1,4).join(', ')+'. Faltante = tienda con estado Z1, sin inventario, sin tránsito y con venta histórica. '
   +'En riesgo = tiene inventario para menos de una semana y nada en tránsito. VP (venta perdida) = venta mensual promedio de esa tienda × costo. '
   +'Precios y ofertas: smrey.com ('+esc(M.tienda_web)+'). Generado '+esc(M.generado)+'.</div>';
  trendChart('c1',a);
  const top=gr.slice(0,14);
  hbar('c2',top,r=>Math.round(r.a.projV),r=>r.k);
  table('t1',grpCols(byG?'Gerente':'Marca',{marcas:byG}),gr,{sort:'Venta',click:r=>byG?verGer(GL.indexOf(r.k)):openMarca(r.k),csv:1});
  const mc=[cProd(),{h:byG?'Gerente':'Marca',v:p=>byG?p.g:p.m,f:p=>'<span class="sub">'+esc(byG?p.g:p.m)+'</span>'},{h:'Δ $',v:p=>p.projV-p.b3V,f:p=>(p.projV>=p.b3V?'<span class="up">+':'<span class="dn">')+fD(p.projV-p.b3V)+'</span>',cls:'r'},{h:'Δ %',v:p=>p.tend,f:p=>tb(p.tend),cls:'r'}];
  table('t2',mc,mov.slice().sort((x,y)=>(y.projV-y.b3V)-(x.projV-x.b3V)).slice(0,10),{click:openProd,lim:10});
  table('t3',mc,mov.slice().sort((x,y)=>(x.projV-x.b3V)-(y.projV-y.b3V)).slice(0,10),{click:openProd,lim:10});
}

/* ───────── Unidades de Negocio ───────── */
function rUnidades(){

   +'<div class="gcards">'+rows.map(r=>{const a=r.a;
     return'<div class="gc" onclick="verUni('+r.i+')"><div class="gn"><span>'+esc(r.u.n)+'</span>'+tb(a.tend)+'</div>'
      +'<div class="gs">'+esc(r.u.j)+' · '+uniq(P.filter(p=>p.uni===r.u.n).map(p=>p.g)).length+' gerentes · '+a.marcas.size+' marcas · '+fN(a.n)+' productos</div>'

      +'<div class="gm"><div><b>'+fD(a.vp)+'</b><span>VP / mes</span></div><div><b>'+fPct(a.quiebre)+'</b><span>% quiebre</span></div><div><b>'+a.of+'</b><span>En oferta</span></div></div>'
      +'<div style="display:flex;justify-content:flex-end">'+spark(a.v)+'</div></div>'}).join('')+'</div>'
   +'<div class="g2" style="margin-top:18px"><div class="card"><h3>Sell-out mensual por unidad <span class="sub">$ a costo Rey</span></h3><div class="ch"><canvas id="c1"></canvas></div></div>'
   +'<div class="card"><h3>Comparativo de unidades</h3><div id="t1"></div></div></div>';

  table('t1',[{h:'Unidad',v:r=>r.u.n,f:r=>'<b>'+esc(r.u.n)+'</b><div class="sub">'+esc(r.u.j)+'</div>'},

    {h:'Faltantes',v:r=>r.a.falt,f:r=>fN(r.a.falt),cls:'r'},{h:'VP/mes',v:r=>r.a.vp,f:r=>fD(r.a.vp),cls:'r'},{h:'Ofertas',v:r=>r.a.of,cls:'r'}],rows,{sort:'Venta',click:r=>verUni(r.i),csv:1});

   +'<div class="card"><h3>Venta '+mesLbl()+' por gerente</h3><div class="ch"><canvas id="c2"></canvas></div></div></div>'
   +'<div class="card"><h3>Gerentes de la unidad <span class="sub">· clic para ver su portafolio</span></h3><div id="t1"></div></div>'
   +'<div class="card"><h3>Marcas de la unidad</h3><div id="t2"></div></div>'

/* ───────── Gerentes ───────── */
function rGerentes(){
  if(GER)return rGerente();
  const gr=grpRows(FP(),p=>p.g).sort((x,y)=>y.a.projV-x.a.projV);
  const tot=agg(FP());
  el('content').innerHTML=hero('Gerentes de marca'+(UNI?' · '+UNI:''),gr.length+' gerentes · cada tarjeta abre el portafolio completo: marcas, productos, sell-out, faltantes y ofertas')
   +'<div class="gcards">'+gr.map(r=>{const a=r.a,i=GL.indexOf(r.k);
     return'<div class="gc" onclick="verGer('+i+')"><div class="gn"><span>'+esc(r.k)+'</span>'+tb(a.tend)+'</div>'
      +'<div class="gs">'+a.marcas.size+' marcas · '+fN(a.n)+' productos · '+fPct(tot.projV?a.projV/tot.projV:0)+(UNI?' de la unidad':' de la venta FM')+'</div>'
      +'<div class="gm"><div><b>'+fK(a.projV)+'</b><span>Venta '+M.meses[4]+'</span></div><div><b class="'+(a.falt?'dn':'')+'">'+fN(a.falt)+'</b><span>Faltantes</span></div><div><b>'+a.of+'</b><span>En oferta</span></div></div>'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div class="gb">'+[...a.marcas].slice(0,8).map(m=>'<span class="chip">'+esc(m)+'</span>').join('')+(a.marcas.size>8?'<span class="chip">+'+(a.marcas.size-8)+'</span>':'')+'</div>'+spark(a.v)+'</div></div>'}).join('')+'</div>';
}
function rGerente(){

/* ───────── Ofertas Rey ───────── */
// Cada oferta vista en smrey.com, con fecha de inicio/fin oficial y su efectividad:
// venta diaria durante la oferta (fotos diarias de Reycom, todas las tiendas) vs. venta diaria de antes.
const fF=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'—';
function ofertas(){
  const PU={};P.forEach(p=>PU[p.upc]=p);
  return(D.O||[]).map(r=>({p:PU[r[0]],ini:r[1],fin:r[2],visto:r[3],act:r[4]===1,tipo:r[5],dto:r[6],preg:r[7],pof:r[8],base:r[9],btipo:r[10],diaria:r[11],dias:r[12]||0,lift:r[13]}))
    .filter(o=>o.p&&(!UNI||o.p.uni===UNI)&&(!GER||o.p.g===GER));
}
const MIN_DIAS=3;
const iniDe=p=>{const r=(D.O||[]).find(r=>r[0]===p.upc&&r[4]===1);return r?r[1]:null};
function efTxt(o){
  if(o.lift==null||o.dias<MIN_DIAS)return'<span class="tag gray">en medición'+(o.dias?' · '+o.dias+' d':'')+'</span>';
  return tb(o.lift);
}
function efVal(o){return o.lift==null||o.dias<MIN_DIAS?null:o.lift}
function ofCols(final){
  return[cProd(),cUPC,{h:'Marca',v:o=>o.p.m,f:o=>'<span class="chip">'+esc(o.p.m)+'</span>'},GER?null:{h:'Gerente',v:o=>o.p.g,f:o=>'<span class="sub">'+esc(o.p.g)+'</span>'},
    {h:'Oferta',v:o=>o.tipo,f:o=>'<span class="tag green">'+esc(o.tipo)+'</span>'},
    {h:'Inicio',v:o=>o.ini,f:o=>fF(o.ini),cls:'r'},
    {h:'Fin',v:o=>o.fin,f:o=>{const q=Math.round((new Date(o.fin)-new Date(M.fecha_csv))/864e5);return fF(o.fin)+(!final&&q>=0?'<div class="sub">quedan '+q+' d</div>':'')},cls:'r'},
    {h:'Precio',v:o=>o.pof,f:o=>'<span class="sub" style="text-decoration:line-through">'+fM(o.preg)+'</span> <b>'+fM(o.pof)+'</b>',cls:'r',x:o=>o.pof},
    {h:'Dto',v:o=>o.dto,f:o=>o.dto+'%',cls:'r'},
    {h:'Venta diaria antes',v:o=>o.base,f:o=>o.base==null?'—':(Math.round(o.base*10)/10)+'<div class="sub">'+(o.btipo==='previo'?'días previos':'prom. 3 meses')+'</div>',cls:'r',x:o=>o.base},
    {h:'Venta diaria en oferta',v:o=>o.diaria,f:o=>o.diaria==null?'—':'<b>'+(Math.round(o.diaria*10)/10)+'</b><div class="sub">'+o.dias+' días medidos</div>',cls:'r',x:o=>o.diaria},
    {h:'Efectividad',v:o=>efVal(o),f:efTxt,cls:'r',x:o=>efVal(o)},
    {h:'Eficiencia',v:o=>efVal(o)!=null&&o.dto?efVal(o)*100/o.dto:null,f:o=>{const e=efVal(o)!=null&&o.dto?efVal(o)*100/o.dto:null;return e==null?'<span class="na">—</span>':'<span class="'+(e>=1?'up':e>=0.5?'':'dn')+'">'+e.toFixed(1)+'x</span>'},cls:'r'},
    final?null:{h:'Faltante',v:o=>o.p.falt,f:o=>o.p.falt?'<span class="tag red">'+o.p.falt+' tiendas</span>':'<span class="na">—</span>',cls:'r'}
  ].filter(Boolean);
}

   +'<div class="g2"><div class="card"><h3>Descuento vs. efectividad <span class="sub">ofertas con '+MIN_DIAS+'+ días medidos · <span class="up">●</span> con stock · <span class="dn">●</span> con faltante</span></h3><div class="ch" id="chw"><canvas id="c1"></canvas></div></div>'

   +'<div class="card"><h3>Ofertas activas <span class="sub">· clic para ver el producto</span></h3><div id="t1"></div></div>'
   +'<div class="card"><h3>Ofertas terminadas <span class="sub">resultado final de cada oferta (últimos 120 días)</span></h3>'+(T2.length?'<div id="t3"></div>':'<div class="note">Todavía no termina ninguna oferta registrada. El historial empezó el 23/10/2026; las ofertas actuales terminan el '+fF(A.length?A.map(o=>o.fin).sort()[0]:'')+'.</div>')+'</div>'
   +'<div class="card"><h3>Productos FM no encontrados en smrey.com <span class="sub">activos y con venta en Reycom · se buscan por código de barras y por nombre; algunos pueden estar con un nombre muy distinto</span></h3><div id="t2"></div></div>'
   +'<div class="note"><b>Cómo se mide la efectividad.</b> Inicio y fin son las fechas oficiales de la promoción en smrey.com. Cada día se guarda la venta acumulada del mes de Reycom (todas las tiendas); la diferencia entre dos días es la venta de ese día. '
   +'"Venta diaria en oferta" = unidades vendidas desde el día antes del inicio hasta hoy (o hasta el fin) ÷ días. "Venta diaria antes" = la de los días previos al inicio cuando hay al menos 7 días de historial; si no, el promedio diario de los 3 meses completos anteriores. '
   +'Efectividad = en oferta ÷ antes − 1; con menos de '+MIN_DIAS+' días medidos se muestra "en medición". Eficiencia = efectividad ÷ % de descuento (1.0x = la venta subió tanto como el descuento).</div>';

    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.o.p.d+' · '+c.raw.x+'% dto · '+(c.raw.y>=0?'+':'')+c.raw.y+'%'}}},

  chart('c2',{type:'bar',data:{labels:gr.slice(0,12).map(r=>r.k),datasets:[{data:gr.slice(0,12).map(r=>r.a.n),backgroundColor:'#059669',borderRadius:5}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid},y:{grid:{display:false}}}}});
  const prodDe=o=>Object.assign({},o,{d:o.p.d,upc:o.p.upc,act:o.p.act});
  table('t1',ofCols(false),A.map(prodDe),{sort:'Dto',click:o=>openProd(o.p),csv:1});
  if(T2.length)table('t3',ofCols(true),T2.map(prodDe),{sort:'Fin',click:o=>openProd(o.p),csv:1});
  table('t2',prodCols().filter(c=>!['Precio Rey','Oferta'].includes(c.h)),sinWeb,{sort:'Venta $',click:openProd,csv:1,lim:30});
}

/* ───────── Tiendas ───────── */
function rTiendas(){
  const FL=FF(),byT=groupBy(FL,x=>x.ti);
  const rows=T.map(t=>{const xs=byT.get(t.i)||[];return{t,n:FIL()?xs.length:t.falt,vp:FIL()?sum(xs,x=>x.vp):t.vp}});
  const cols=[{h:'Tienda',v:r=>r.t.t,f:r=>'<b>'+esc(r.t.t)+'</b>'}];
  if(!FIL())cols.push({h:'Productos',v:r=>r.t.filas,cls:'r'},{h:'Venta '+mesLbl(),v:r=>r.t.projV,f:r=>'<b>'+fD(r.t.projV)+'</b>',cls:'r'},
    {h:'Δ vs 3M',v:r=>r.t.b3V>0?(r.t.projV-r.t.b3V)/r.t.b3V:null,f:r=>tb(r.t.b3V>0?(r.t.projV-r.t.b3V)/r.t.b3V:null),cls:'r'},
    {h:'5 meses',v:r=>r.t.v[4],f:r=>spark(r.t.v),nos:1,nocsv:1});
  cols.push({h:'Faltantes',v:r=>r.n,f:r=>r.n?'<span class="tag red">'+r.n+'</span>':'<span class="na">0</span>',cls:'r'});
  if(!FIL())cols.push({h:'% quiebre',v:r=>r.t.filas?r.t.falt/r.t.filas:0,f:r=>fPct(r.t.filas?r.t.falt/r.t.filas:0),cls:'r'},{h:'En riesgo',v:r=>r.t.ries,f:r=>r.t.ries?'<span class="tag amber">'+r.t.ries+'</span>':'<span class="na">0</span>',cls:'r'});
  cols.push({h:'VP/mes',v:r=>r.vp,f:r=>r.vp?fD(r.vp):'<span class="na">—</span>',cls:'r'});
  const top=rows.slice().sort((a,b)=>b.vp-a.vp).slice(0,15);
  el('content').innerHTML=hero('Tiendas',fN(T.length)+' tiendas Rey / Romero / Super Precio en el reporte'+(FIL()?' · faltantes de '+esc(GER||UNI)+' (la venta por tienda solo está disponible para el total FM)':''))
   +(FIL()?'':'<div class="card"><h3>Venta '+mesLbl()+' por tienda <span class="sub">top 15</span></h3><div class="ch tall"><canvas id="c2"></canvas></div></div>')
   +'<div class="card"><h3>Venta perdida por tienda <span class="sub">top 15</span></h3><div class="ch tall"><canvas id="c1"></canvas></div></div>'
   +'<div class="card"><h3>Todas las tiendas <span class="sub">· clic para ver sus faltantes</span></h3><div class="filters"><input id="qt" placeholder="Buscar tienda…" oninput="fTiendas()"></div><div id="t1"></div></div>';
  hbar('c1',top,r=>Math.round(r.vp),r=>r.t.t.replace(/^\d+ - /,''),'#dc2626');
  if(!FIL())hbar('c2',T.slice().sort((a,b)=>b.projV-a.projV).slice(0,15),t=>Math.round(t.projV),t=>t.t.replace(/^\d+ - /,''),'#2563eb');
  window._tr={rows,cols};fTiendas();
}
function fTiendas(){const q=(el('qt').value||'').toLowerCase();table('t1',window._tr.cols,window._tr.rows.filter(r=>!q||r.t.t.toLowerCase().includes(q)),{sort:'VP/mes',click:r=>openTienda(r.t),csv:1})}
function openTienda(t){
  const xs=FF().filter(x=>x.ti===t.i).sort((a,b)=>b.vp-a.vp);
  openM(t.t,fN(xs.length)+' faltantes'+(FIL()?' de '+esc(GER||UNI):'')+' · VP '+fD(sum(xs,x=>x.vp))+'/mes',
    (FIL()?'':'<div class="info"><div><span>Productos FM listados</span><b>'+fN(t.filas)+'</b></div><div><span>Venta '+mesLbl()+'</span><b>'+fD(t.projV)+'</b></div><div><span>Δ vs 3M</span><b>'+tb(t.b3V>0?(t.projV-t.b3V)/t.b3V:null)+'</b></div><div><span>% quiebre</span><b>'+fPct(t.filas?t.falt/t.filas:0)+'</b></div><div><span>En riesgo</span><b>'+fN(t.ries)+'</b></div></div>')
    +(xs.length?'<div id="tm"></div>':'<div class="note">Sin faltantes en esta tienda.</div>'));
  if(xs.length)table('tm',[{h:'Producto',v:x=>x.p.d,f:x=>'<div class="pn">'+esc(x.p.d)+'</div><div class="sub">'+x.p.upc+'</div>'},{h:'Marca',v:x=>x.p.m,f:x=>'<span class="chip">'+esc(x.p.m)+'</span>'},GER?null:{h:'Gerente',v:x=>x.p.g,f:x=>'<span class="sub">'+esc(x.p.g)+'</span>'},{h:'VP/mes',v:x=>x.vp,f:x=>'<b>'+fD(x.vp)+'</b>',cls:'r'},{h:'Inv. otras tiendas',v:x=>x.p.inv,f:x=>fN(x.p.inv),cls:'r'},{h:'Oferta',v:x=>x.p.dto,f:x=>x.p.pof?'<span class="tag amber">'+esc(x.p.tipo)+'</span>':'',cls:'r'}].filter(Boolean),xs,{sort:'VP/mes',lim:300,csv:1,click:x=>openProd(x.p)});
}

/* ───────── Modal ───────── */
function openM(t,s,body){if(CH.cm){CH.cm.destroy();delete CH.cm}el('mt').innerHTML=esc(t)+'<span class="sub">'+s+'</span>';el('mb').innerHTML=body;el('modal').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeM(){el('modal').classList.add('hidden');document.body.style.overflow='';if(CH.cm){CH.cm.destroy();delete CH.cm}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
</script>
</body>
</html>
